name: flutter_transit_app
description: "A production-grade offline transit routing engine for Flutter with SQLCipher encryption, dynamic signal delay modeling, and isolate compute."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.20
  flutter_secure_storage: ^9.0.0
  google_maps_flutter: ^2.5.3
  crypto: ^3.0.3
  path: ^1.9.0
  path_provider: ^2.1.2
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/database/
